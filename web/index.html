  <!-- Service Worker Cache Bust - Version 21.6 -->
  <!-- КРИТИЧНО: Этот скрипт выполняется ПЕРВЫМ для отключения Service Workers ДО загрузки приложения -->
  <script>
    (function() {
      var EXPECTED_VERSION = '21.6';
      var VERSION_TIMESTAMP = Date.now();
      console.log('🚀 Cache Bust Script v' + EXPECTED_VERSION + ' at ' + new Date().toISOString());
      
      // ШАГ 1: НЕМЕДЛЕННО отключить все Service Workers ДО загрузки приложения
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          console.log('🔴 Found ' + registrations.length + ' service workers - unregistering ALL');
          var unregisterPromises = registrations.map(function(registration) {
            return registration.unregister().then(function(success) {
              console.log('🔴 Service Worker unregistered:', registration.scope, success);
              return success;
            }).catch(function(err) {
              console.error('🔴 Error unregistering SW:', err);
              return false;
            });
          });
          Promise.all(unregisterPromises).then(function(results) {
            console.log('🔴 All service workers unregistered:', results.every(r => r));
          });
        }).catch(function(err) {
          console.error('🔴 Error getting service worker registrations:', err);
        });
      }
      
      // ШАГ 2: НЕМЕДЛЕННО очистить все кеши
      if ('caches' in window) {
        caches.keys().then(function(names) {
          console.log('🔴 Found ' + names.length + ' caches - deleting ALL');
          var deletePromises = names.map(function(name) {
            return caches.delete(name).then(function(success) {
              console.log('🔴 Cache deleted:', name, success);
              return success;
            });
          });
          Promise.all(deletePromises).then(function(results) {
            console.log('🔴 All caches deleted:', results.every(r => r));
          });
        });
      }
      
      // ШАГ 3: Проверка версии после загрузки main.dart.js с более агрессивной проверкой
      var versionCheckAttempts = 0;
      var maxAttempts = 15; // Увеличено количество попыток
      var lastCheckedVersion = sessionStorage.getItem('lastCheckedVersion');
      
      // Если версия не совпадает или не проверялась - принудительно перезагрузить
      if (lastCheckedVersion && lastCheckedVersion !== EXPECTED_VERSION) {
        console.warn('⚠️ Stored version mismatch:', lastCheckedVersion, 'vs', EXPECTED_VERSION);
        sessionStorage.removeItem('lastCheckedVersion');
        sessionStorage.removeItem('versionChecked');
        sessionStorage.removeItem('forceReload');
        sessionStorage.removeItem('cacheCleared');
      }
      
      var checkVersion = setInterval(function() {
        versionCheckAttempts++;
        
        // Проверяем версию в глобальной области (устанавливается в main.dart через js.context)
        if (typeof window.DEPLOY_VERSION !== 'undefined') {
          clearInterval(checkVersion);
          var actualVersion = window.DEPLOY_VERSION;
          console.log('📦 Detected version in JS:', actualVersion, 'Expected:', EXPECTED_VERSION);
          
          sessionStorage.setItem('lastCheckedVersion', actualVersion);
          
          if (actualVersion !== EXPECTED_VERSION) {
            console.warn('⚠️ Version mismatch! Actual:', actualVersion, 'Expected:', EXPECTED_VERSION);
            console.warn('⚠️ Forcing full cache clear and reload...');
            
            // Еще раз очищаем все кеши
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) {
                  caches.delete(name);
                });
                // Отключаем service workers еще раз
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    regs.forEach(function(reg) {
                      reg.unregister();
                    });
                    // Перезагрузка с очисткой кеша
                    setTimeout(function() {
                      window.location.href = window.location.href.split('?')[0] + '?v=' + VERSION_TIMESTAMP;
                    }, 100);
                  });
                } else {
                  window.location.href = window.location.href.split('?')[0] + '?v=' + VERSION_TIMESTAMP;
                }
              });
            } else {
              window.location.href = window.location.href.split('?')[0] + '?v=' + VERSION_TIMESTAMP;
            }
            return;
          } else {
            console.log('✅ Version check passed:', actualVersion);
            sessionStorage.setItem('versionChecked', EXPECTED_VERSION);
          }
        } else if (versionCheckAttempts >= maxAttempts) {
          clearInterval(checkVersion);
          console.warn('⚠️ Could not detect DEPLOY_VERSION after', maxAttempts, 'attempts');
          
          // Если версия не найдена после всех попыток - принудительно перезагрузить с очисткой
          var forceReloadKey = 'forceReload_' + EXPECTED_VERSION;
          if (sessionStorage.getItem(forceReloadKey) !== 'done') {
            console.warn('⚠️ Force reload due to version detection failure');
            sessionStorage.setItem(forceReloadKey, 'done');
            
            // Финальная очистка всего
            Promise.all([
              'caches' in window ? caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) {
                  return caches.delete(name);
                }));
              }) : Promise.resolve(),
              'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(reg) {
                  return reg.unregister();
                }));
              }) : Promise.resolve()
            ]).then(function() {
              // Перезагрузка с уникальным параметром для обхода кеша
              window.location.href = window.location.href.split('?')[0] + '?v=' + VERSION_TIMESTAMP + '&force=true';
            });
          }
        }
      }, 500);
      // ШАГ 4: Перехват загрузки main.dart.js через модификацию _flutter.buildConfig
      // Это более надежный способ чем перехват createElement
      var originalFlutterConfig = window._flutter;
      Object.defineProperty(window, '_flutter', {
        get: function() {
          return originalFlutterConfig;
        },
        set: function(value) {
          originalFlutterConfig = value;
          // Модифицируем buildConfig для добавления версии к main.dart.js
          if (value && value.buildConfig && value.buildConfig.builds) {
            value.buildConfig.builds.forEach(function(build) {
              if (build && build.mainJsPath && typeof build.mainJsPath === 'string') {
                if (build.mainJsPath.includes('main.dart.js') && !build.mainJsPath.includes('?v=')) {
                  build.mainJsPath = build.mainJsPath + '?v=' + EXPECTED_VERSION + '&t=' + VERSION_TIMESTAMP;
                  console.log('🔧 Modified buildConfig mainJsPath:', build.mainJsPath);
                }
              }
            });
          }
        },
        configurable: true
      });
    })();
      // ШАГ 4: Упрощенный подход - перехватываем загрузку через MutationObserver
      // Наблюдаем за добавлением script тегов и модифицируем их src
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.tagName === 'SCRIPT' && node.src) {
              var src = node.src;
              if (typeof src === 'string' && src.includes('main.dart.js') && !src.includes('?v=')) {
                var newSrc = src + '?v=' + EXPECTED_VERSION + '&t=' + VERSION_TIMESTAMP;
                console.log('🔧 Detected main.dart.js, modifying:', src, '->', newSrc);
                node.src = newSrc;
              }
            }
          });
        });
      });
      
      // Начинаем наблюдение
      observer.observe(document.head, { childList: true, subtree: true });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

  <script>
    // Модифицируем _flutter.buildConfig перед загрузкой bootstrap для добавления версии к main.dart.js
    (function() {
      var EXPECTED_VERSION = '21.6';
      var VERSION_TIMESTAMP = Date.now();
      
      // Перехватываем установку _flutter.buildConfig
      if (!window._flutter) {
        window._flutter = {};
      }
      
      var originalFlutter = window._flutter;
      Object.defineProperty(window, '_flutter', {
        get: function() {
          return originalFlutter;
        },
        set: function(value) {
          originalFlutter = value;
          if (value && value.buildConfig && value.buildConfig.builds) {
            value.buildConfig.builds.forEach(function(build) {
              if (build && build.mainJsPath && typeof build.mainJsPath === 'string') {
                if (build.mainJsPath.includes('main.dart.js') && !build.mainJsPath.includes('?v=')) {
                  build.mainJsPath = build.mainJsPath + '?v=' + EXPECTED_VERSION + '&t=' + VERSION_TIMESTAMP;
                  console.log('🔧 Modified buildConfig mainJsPath:', build.mainJsPath);
                }
              }
            });
          }
        },
        configurable: true
      });
      
      // Также перехватываем buildConfig если он уже существует
      if (originalFlutter && originalFlutter.buildConfig && originalFlutter.buildConfig.builds) {
        originalFlutter.buildConfig.builds.forEach(function(build) {
          if (build && build.mainJsPath && typeof build.mainJsPath === 'string') {
            if (build.mainJsPath.includes('main.dart.js') && !build.mainJsPath.includes('?v=')) {
              build.mainJsPath = build.mainJsPath + '?v=' + EXPECTED_VERSION + '&t=' + VERSION_TIMESTAMP;
              console.log('🔧 Modified existing buildConfig mainJsPath:', build.mainJsPath);
            }
          }
        });
      }
    })();
  </script>
